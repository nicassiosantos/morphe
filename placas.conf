# placas.conf -- as placas DE1-SoC do laboratorio, para todos os computadores.
#
# O aplicativo le esta lista junto com a do .morphe-estado/placas (que o
# morphe-up.sh grava so na maquina onde roda). Com ela, um computador recem-
# instalado acha as placas sem varrer a rede: basta o git clone / git pull.
#
# Um IP por linha; o resto da linha e comentario livre. Linhas com # sao
# ignoradas. O HOSTNAME e o que identifica a placa: o aplicativo e o
# morphe-up.sh acham cada placa por broadcast, pelo nome, no IP que o DHCP
# der a ela. Se um IP mudar, corrigir aqui so deixa a conexao imediata; nao
# e obrigatorio, e a reserva de DHCP na TI ficou desnecessaria (30/09/2026).
#
# Sem permissao de escrita neste repositorio, a placa nova vai, no mesmo
# formato, no placas.local.conf (fora do git, ao lado deste arquivo): o
# aplicativo e o morphe-up.sh leem os dois, e o atualizar-lab.sh copia o da
# estacao para os computadores (22/10/2026).
#
# Sem o cabo JTAG desde 22/10/2026: o nome dele ("DE-SoC [1-2]") vem da porta
# USB da estacao, nao da placa, e mudava cada vez que um cabo trocava de porta.
# Quem grava a FPGA e o aplicativo (ou o morphe-up.sh --todas), pelo que
# estiver ligado no USB; cada placa reconhece o proprio bitstream pela
# assinatura. Uma linha antiga com o cabo no fim continua aceita.
#
# IP              placa, hostname, MAC
